name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/mtproxy
          cp app.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/
          cp Data.kt MainActivity.kt app/src/main/java/com/example/mtproxy/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MTProxyManager-apk
          path: app/build/outputs/apk/debug/app-debug.apk
